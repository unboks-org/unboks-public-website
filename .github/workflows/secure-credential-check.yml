name: Temporary audit account preparation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure temporary VPS access
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.UNBOKS_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '108.61.192.52 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF/4i1uK8Lr6hVzsCRKBKMt1HGXzNRzZdSUlKd0EM+Qb' > ~/.ssh/known_hosts

      - name: Locate Consulta Despertares runtime without reading secrets
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 root@108.61.192.52 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail
          found=0
          while IFS= read -r container_id; do
            [ -n "$container_id" ] || continue
            name="$(docker inspect --format '{{.Name}}' "$container_id" | sed 's#^/##')"
            image="$(docker inspect --format '{{.Config.Image}}' "$container_id")"
            project="$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "$container_id")"
            service="$(docker inspect --format '{{index .Config.Labels "com.docker.compose.service"}}' "$container_id")"
            workdir="$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$container_id")"
            config_files="$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project.config_files"}}' "$container_id")"
            has_dashboard_password=0
            has_consulta_slug=0
            while IFS= read -r line; do
              case "$line" in
                DASHBOARD_PASSWORD=*) has_dashboard_password=1 ;;
                CLIENT_CONFIG_PATH=*consulta-despertares*) has_consulta_slug=1 ;;
                TENANT_ID=consulta-despertares|TENANT_SLUG=consulta-despertares|CLIENT_SLUG=consulta-despertares) has_consulta_slug=1 ;;
              esac
            done < <(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$container_id")
            case "$name $project $service $workdir $config_files" in
              *consulta-despertares*) has_consulta_slug=1 ;;
            esac
            if [ "$has_consulta_slug" = 1 ]; then
              found=1
              printf 'TARGET_CONTAINER=%s\n' "$name"
              printf 'TARGET_IMAGE=%s\n' "$image"
              printf 'COMPOSE_PROJECT=%s\n' "$project"
              printf 'COMPOSE_SERVICE=%s\n' "$service"
              printf 'COMPOSE_WORKDIR=%s\n' "$workdir"
              printf 'COMPOSE_CONFIG_FILES=%s\n' "$config_files"
              printf 'HAS_DASHBOARD_PASSWORD=%s\n' "$has_dashboard_password"
              printf 'MOUNTS_BEGIN\n'
              docker inspect --format '{{range .Mounts}}{{println .Type "|" .Source "|" .Destination}}{{end}}' "$container_id"
              printf 'MOUNTS_END\n'
            fi
          done < <(docker ps -q)
          [ "$found" = 1 ] || { echo 'Consulta Despertares runtime not found' >&2; exit 1; }
          REMOTE_SCRIPT
