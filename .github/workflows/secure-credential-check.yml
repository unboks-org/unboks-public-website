name: Secure credential check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure temporary VPS access
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.UNBOKS_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '108.61.192.52 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIF/4i1uK8Lr6hVzsCRKBKMt1HGXzNRzZdSUlKd0EM+Qb' > ~/.ssh/known_hosts

      - name: Retrieve only the verified Unboks tenant key
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 root@108.61.192.52 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail
          
          emit_if_valid() {
            local candidate="$1"
            [ -n "$candidate" ] || return 1
          
            local payload status
            payload="$(UNBOKS_CANDIDATE="$candidate" python3 - <<'PY'
          import json, os
          print(json.dumps({'password': os.environ['UNBOKS_CANDIDATE']}), end='')
          PY
          )"
            status="$(curl -ksS -o /dev/null -w '%{http_code}' \
              -H 'Host: api.unboks.org' \
              -H 'Content-Type: application/json' \
              --data "$payload" \
              'https://127.0.0.1/api/unboks/dashboard/api/login')"
          
            if [ "$status" != "200" ]; then
              return 1
            fi
          
            cat > /tmp/unboks-public.pem <<'PUBLIC_KEY'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA1YWnw0NCzZ1O10vw3cS+
          G/KD7EiE4UnsC0ChziXoWGNn4/L67lpZPirpEoXl8SewOm2JqBVp0BHc2RFdDUkF
          9qcZZoy7m7ou+xbZD/Bc2mVdGBYf96KVpEm337vTiU/Bi+Lf60gjGOSgjXxX0Orj
          Q2Qhhg4REE0PLl+W67vCPPUq/OVmZpoNuQnIHua4CA+waBGWMc9jUufau1Y9QDZe
          oWMWqIwy8kMYVwAZYabejQI9hkPidC7QY3g+WbyTNMRICwGkoKbwoKOzFq87xOtn
          qJU84JsF8b7pe5541t9kWV78Ok72T4JHcAbCbbE9DuJbvsuK7utfgIv0+mbnn8Wq
          3n5vsaabmOyvSFljblvmt1J0jzXk6yMhZ+/n6/KTBZnWfM2FN74du8vQPpF0sJsH
          5PffGImh2nJHCLMgvqWA4kQp8r0FF+dAKxlEif5l43DAMGi5UCtgSRdBhHuTcZbq
          cZS2KtdonQAlfl976N39192qKPO0VPLqq/a2DmMK8SCEgODZTb0Bot8PpxxF3aBm
          gPodhVRO82ohD4ielEOc+jzYALjbYDzQD0gqGmMWQ3MSOtH2/fB56DtxdYBCI8Dr
          Zy9p0wuZ16a/0JoPJ+hrWKAp30G08CbBQiCUgf9vv4PCtiPyMIoZtg16T4brOcVx
          XNujtMjS7aIU5f+kmqXN1jcCAwEAAQ==
          -----END PUBLIC KEY-----
          PUBLIC_KEY
            trap 'unlink /tmp/unboks-public.pem' EXIT
            printf 'ENCRYPTED_CREDENTIAL='
            printf '%s' "$candidate" | openssl pkeyutl -encrypt \
              -pubin -inkey /tmp/unboks-public.pem \
              -pkeyopt rsa_padding_mode:oaep \
              -pkeyopt rsa_oaep_md:sha256 | base64 -w0
            printf '\n'
            exit 0
          }
          
          if command -v docker >/dev/null 2>&1; then
            while IFS= read -r container_id; do
              [ -n "$container_id" ] || continue
              while IFS= read -r line; do
                case "$line" in
                  UNBOKS_PASSWORD=*)
                    if emit_if_valid "${line#UNBOKS_PASSWORD=}"; then :; fi
                    ;;
                esac
              done < <(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$container_id" 2>/dev/null || true)
            done < <(docker ps -q 2>/dev/null || true)
          fi
          
          for envfile in /proc/[0-9]*/environ; do
            [ -r "$envfile" ] || continue
            while IFS= read -r line; do
              case "$line" in
                UNBOKS_PASSWORD=*)
                  if emit_if_valid "${line#UNBOKS_PASSWORD=}"; then :; fi
                  ;;
              esac
            done < <((tr '\0' '\n' < "$envfile") 2>/dev/null || true)
          done
          
          while IFS= read -r encoded; do
            [ -n "$encoded" ] || continue
            candidate="$(printf '%s' "$encoded" | base64 -d)"
            if emit_if_valid "$candidate"; then :; fi
          done < <(python3 - <<'PY'
          import base64
          import json
          import os
          import re
          
          roots = ['/root', '/opt', '/srv', '/etc', '/var/www', '/home']
          skip_dirs = {'proc', 'sys', 'dev', 'node_modules', '.git', 'cache', 'logs', 'log'}
          json_names = {'client.json', 'tenant.json', 'config.json', 'clients.json'}
          text_names = {'.env', 'docker-compose.yml', 'docker-compose.yaml', 'compose.yml', 'compose.yaml'}
          paths = [
              ('dashboard_access_key',), ('access_key',), ('password',),
              ('auth', 'dashboard_access_key'), ('auth', 'access_key'), ('auth', 'password'),
              ('dashboard', 'access_key'), ('dashboard', 'password'),
              ('dashboard', 'auth', 'access_key'), ('dashboard', 'auth', 'password'),
          ]
          seen = set()
          
          def emit(value):
              if not isinstance(value, str) or not value or value in seen:
                  return
              seen.add(value)
              print(base64.b64encode(value.encode()).decode())
          
          for root in roots:
              if not os.path.isdir(root):
                  continue
              for dirpath, dirnames, filenames in os.walk(root):
                  dirnames[:] = [d for d in dirnames if d not in skip_dirs]
                  for name in filenames:
                      low = name.lower()
                      path = os.path.join(dirpath, name)
                      try:
                          size = os.path.getsize(path)
                      except OSError:
                          continue
                      if size > 1_000_000:
                          continue
          
                      if low in json_names or ('unboks' in path.lower() and low.endswith('.json')):
                          try:
                              with open(path, 'r', encoding='utf-8') as handle:
                                  data = json.load(handle)
                          except Exception:
                              data = None
                          if isinstance(data, dict):
                              for key_path in paths:
                                  cur = data
                                  for part in key_path:
                                      if not isinstance(cur, dict) or part not in cur:
                                          cur = None
                                          break
                                      cur = cur[part]
                                  emit(cur)
          
                      is_env = low.startswith('.env') or low.endswith('.env')
                      is_service = low.endswith('.service')
                      if is_env or is_service or low in text_names:
                          try:
                              with open(path, 'r', encoding='utf-8', errors='ignore') as handle:
                                  text = handle.read()
                          except Exception:
                              continue
                          for line in text.splitlines():
                              match = re.search(r'(?:^|[-\s])UNBOKS_PASSWORD\s*[:=]\s*(.+?)\s*$', line)
                              if not match:
                                  continue
                              value = match.group(1).strip()
                              if value.startswith(('"', "'")) and value.endswith(value[0]) and len(value) >= 2:
                                  value = value[1:-1]
                              else:
                                  value = value.split(' #', 1)[0].strip()
                              if not value.startswith('${'):
                                  emit(value)
          PY
          )
          
          echo 'No verified Unboks credential source was found' >&2
          exit 1
          REMOTE_SCRIPT
